server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location = /healthz { access_log off; return 200 'ok'; }
    location = /downloads/EyeLine.dmg {
        alias /usr/share/nginx/html/downloads/Prompter.dmg;
        default_type application/x-apple-diskimage;
        add_header Content-Disposition 'attachment; filename="EyeLine.dmg"';
        add_header Cache-Control 'no-store';
        add_header X-Content-Type-Options nosniff always;
    }
    location /downloads/ {
        autoindex off;
        try_files $uri =404;
        types { application/x-apple-diskimage dmg; }
        add_header Content-Disposition 'attachment; filename="Prompter.dmg"';
        add_header Cache-Control 'no-store';
        add_header X-Content-Type-Options nosniff always;
    }
    location /assets/ { try_files $uri =404; expires 7d; }
    location = /index.html { add_header Cache-Control 'no-cache'; }
    location / { try_files $uri $uri/ =404; }
}
