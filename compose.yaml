services:
  prompter:
    build: .
    container_name: prompter-website
    restart: unless-stopped
    volumes:
      - /opt/prompter/downloads:/usr/share/nginx/html/downloads:ro
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_default
      - traefik.http.routers.prompter.rule=Host(`kavitha.cloud`)
      - traefik.http.routers.prompter.priority=1
      - traefik.http.routers.prompter.entrypoints=websecure
      - traefik.http.routers.prompter.tls=true
      - traefik.http.routers.prompter.tls.certresolver=letsencrypt
      - traefik.http.services.prompter.loadbalancer.server.port=80
    security_opt:
      - no-new-privileges:true
networks:
  traefik:
    external: true
    name: traefik_default
